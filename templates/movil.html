<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke - Aramar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="escenario">

    <header>
        <h1>KARAOKE ARAMAR</h1>
        <p class="titulo">{{ cancion or "Esperando..." }}</p>
    </header>

    <main>
        <div id="cuentaAtras"></div>
        {% if not lineas %}
            <h4 class="linea">Esperando a que pongan una canción...</h4>
        {% else %}
            {% for linea in lineas %}
            <h4 class="linea">{{ linea.texto }}</h4>
            {% endfor %}
        {% endif %}
    </main>

<!-- los datos que solo sabe Python -->
<script>
    const MODO    = "movil";
    const LINEAS  = {{ lineas | tojson }};
    const CANCION = {{ cancion | tojson }};
    const VERSION = {{ version | tojson }};
</script>
<!-- y toda la logica, compartida con la tele -->
<script src="{{ url_for('static', filename='karaoke.js') }}"></script>
</body>
</html>
