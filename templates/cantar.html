<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ cancion }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="escenario">

    <header>
        <h1>KARAOKE ARAMAR</h1>
        <p class="titulo">{{ cancion }}</p>
    </header>

    <main>
        <div id="cuentaAtras"></div>
        {% for linea in lineas %}
        <h4 class="linea">{{ linea.texto }}</h4>
        {% endfor %}
    </main>

    <footer>
        {% if fiesta %}
        <a href="{{ url_for('parar') }}">Parar la fiesta</a>
        {% else %}
        <a href="{{ url_for('portada') }}">Volver</a>
        {% endif %}
        <audio id="reproductor" controls src="{{ url_for('sonar', cancion_id=cancion) }}"></audio>
        {% if fiesta %}
        <a href="{{ url_for('tutiplen') }}">Saltar &rsaquo;&rsaquo;</a>
        {% endif %}
    </footer>


<!-- los datos que solo sabe Python -->
<script>
    const MODO    = "tele";
    const LINEAS  = {{ lineas | tojson }};
    const CANCION = {{ cancion | tojson }};
    const FIESTA  = {{ fiesta | tojson }};
</script>
<!-- y toda la logica, compartida con el movil -->
<script src="{{ url_for('static', filename='karaoke.js') }}"></script>
</body>
</html>
