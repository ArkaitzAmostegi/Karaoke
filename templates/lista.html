<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Canciones</title>
</head>
<body>
    <h1>Lista de canciones</h1>
    <ul>
        {% for c in canciones %}
        <li>
            <a href="{{ url_for('cantar', cancion_id=c) }}">{{ c }}</a>
            <a href="{{ url_for('editar', cancion_id=c) }}">Sincronizar</a>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
